[project]
name = "sushiro-mcp"
version = "0.1.0"
description = "MCP server exposing the Sushiro Hong Kong SushiPass queue API as tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jaguar-Kwok" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp[cli]>=2",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.scripts]
sushiro-mcp = "sushiro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sushiro_mcp"]
